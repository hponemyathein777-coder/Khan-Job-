<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Job Job Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .calculator-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo {
            background: #007bff;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #007bff;
        }
        .strips-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #e9ecef;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-circle:active {
            background: #dee2e6;
        }
        .result-box {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .result-item:last-child {
            margin-bottom: 0;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <div class="logo">K</div>
        <h2 class="title">Khan Job Job Calculator</h2>
    </div>

    <div class="input-group">
        <label>Height</label>
        <input type="number" id="height" value="100" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Hollow</label>
        <input type="number" id="hollow" value="1" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Long Gap</label>
        <input type="number" id="longGap" value="1" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Short Gap</label>
        <input type="number" id="shortGap" value="4" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Strips</label>
        <div class="strips-control">
            <button class="btn-circle" onclick="changeStrips(-1)">-</button>
            <input type="number" id="strips" value="5" oninput="calculate()" style="text-align: center;">
            <button class="btn-circle" onclick="changeStrips(1)">+</button>
        </div>
    </div>

    <div class="result-box">
        <div class="result-item">
            <span>Remaining Space:</span>
            <span id="remainingSpace">0</span>
        </div>
        <div class="result-item">
            <span>Gap Result:</span>
            <span id="gapResult">0</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const height = parseFloat(document.getElementById('height').value) || 0;
        const hollow = parseFloat(document.getElementById('hollow').value) || 0;
        const longGap = parseFloat(document.getElementById('longGap').value) || 0;
        const shortGap = parseFloat(document.getElementById('shortGap').value) || 0;
        const strips = parseFloat(document.getElementById('strips').value) || 1;

        const remainingSpace = height - (hollow + longGap + shortGap);
        const gapResult = strips > 0 ? (remainingSpace / strips).toFixed(2) : 0;

        document.getElementById('remainingSpace').innerText = remainingSpace;
        document.getElementById('gapResult').innerText = gapResult;
    }

    function changeStrips(val) {
        const stripsInput = document.getElementById('strips');
        let currentVal = parseInt(stripsInput.value) || 0;
        currentVal += val;
        if (currentVal < 1) currentVal = 1;
        stripsInput.value = currentVal;
        calculate();
    }

    calculate();
</script>

</body>
</html>
